# Override used ONLY to build/publish the image (maintainer machine with
# Nexus access — e.g. the Ubuntu build box). Adds a build step and tags
# the result with the same name docker-compose.yml pulls, so clients never
# need to build anything themselves.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml push
# or just: ./scripts/build-and-push-image.sh
services:
  widgets-dev:
    build:
      context: .
    image: ${WIDGETS_IMAGE:-ghcr.io/app-insight/insight-widgets:latest}

  # Builds the Ollama image with the coding model baked in (see
  # Dockerfile.ollama). Needs internet access to Ollama's registry, but NOT
  # Nexus -- unlike widgets-dev, this can be built on any machine.
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:14b}
    image: ${OLLAMA_IMAGE:-ghcr.io/app-insight/insight-ollama:latest}
    profiles: ["ollama"]
